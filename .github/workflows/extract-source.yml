name: Extract jPDFRsc source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bot] Extracted jPDFRsc source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          archives = glob.glob("jPDFRsc-v0.4.0*.zip")
          if not archives:
              raise SystemExit("jPDFRsc v0.4.0 ZIP archive not found")
          archive = sorted(archives)[0]
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  if info.is_dir() or "__pycache__" in name or name.endswith((".pyc", ".pyo")):
                      continue
                  if not name.startswith("jpdfrsc/"):
                      continue
                  target = name[len("jpdfrsc/"):]
                  if not target:
                      continue
                  import os
                  os.makedirs(os.path.dirname(target) or ".", exist_ok=True)
                  with open(target, "wb") as f:
                      f.write(z.read(info))
          PY
      - name: Commit extracted files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "[bot] Extracted jPDFRsc source"
            git push
          fi
