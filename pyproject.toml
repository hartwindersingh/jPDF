[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpdfrsc"
version = "0.4.0"
description = "PDF internal resource explorer and forensic editor"
requires-python = ">=3.10"
dependencies = ["pikepdf>=9.0", "PySide6>=6.7", "PyMuPDF>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
include = ["jpdfrsc*"]
